<div class="cart-container" *ngIf="cartItems.length > 0; else emptyCart">
  <h2>Mon Panier</h2>
  <div class="cart-items">
    <div class="cart-item" *ngFor="let item of cartItems; let i = index">
      <img [src]="item.imageUrl" alt="{{ item.name }}" class="event-image" />
      <div class="event-details">
        <h3>{{ item.name }}</h3>
        <!-- <p>Date : {{ item.date | date: 'dd:/MM/yyyy' }}</p> -->
        <!-- <p>Prix : {{ item.price | currency:'EUR' }}</p> -->
      </div>
      <button class="remove-btn" (click)="removeFromCart(i)">Supprimer</button>
    </div>
  </div>
  <div class="cart-footer">
    <!-- <h3>Total: {{ getTotalPrice() | currency:'EUR' }}</h3> -->
    <button class="checkout-btn" (click)="checkout()">
      Passer la commande
    </button>
  </div>
</div>

<ng-template #emptyCart>
  <p class="empty-cart-message">Votre panier est vide.</p>
</ng-template>
